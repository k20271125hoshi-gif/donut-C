<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>DONUT MATCH</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <h1>DONUT MATCH</h1>
      </div>

      <div class="top-stats" aria-label="本日の状況">
        <div class="stat-pill">
          <span>トッピング待ち</span>
          <strong id="toppingWaitingCount">0</strong>
        </div>
        <div class="stat-pill">
          <span>商品渡し待ち</span>
          <strong id="handoffWaitingCount">0</strong>
        </div>
        <div class="stat-pill">
          <span>渡し完了</span>
          <strong id="completedCount">0</strong>
        </div>
      </div>
    </header>

    <main class="view-stack">
      <section class="app-view active" id="view-order" data-view="order">
        <div class="page-heading">
          <h2>注文受付</h2>
        </div>

        <div class="order-layout">
          <section class="panel order-panel">
            <div class="panel-head">
              <h3>商品</h3>
            </div>

            <div class="product-grid" id="productGrid"></div>

            <div class="cart-card">
              <div class="cart-head">
                <h3>注文内容</h3>
                <button class="text-btn" id="clearCartBtn" type="button">クリア</button>
              </div>

              <div id="cartEmpty" class="empty-state">商品を選択してください</div>
              <div id="cartItems" class="cart-items"></div>

              <label class="name-field">
                <span>お客さんの名前</span>
                <input
                  id="customerNameInput"
                  type="text"
                  maxlength="30"
                  autocomplete="off"
                  placeholder="名前を入力"
                />
              </label>

              <div class="cart-footer">
                <div>
                  <span>合計</span>
                  <strong id="cartTotal">¥0</strong>
                </div>
                <button class="primary-btn" id="submitOrderBtn" type="button" disabled>注文を登録</button>
              </div>
            </div>
          </section>

          <aside class="panel inventory-panel">
            <div class="panel-head compact">
              <h3>在庫</h3>
              <button class="ghost-btn small" id="inventoryEditBtn" type="button">編集</button>
            </div>
            <div id="inventoryList" class="inventory-list"></div>
          </aside>
        </div>
      </section>

      <section class="app-view" id="view-topping" data-view="topping" hidden>
        <div class="page-heading">
          <h2>トッピング</h2>
          <div class="count-chip"><span>待ち</span><strong id="toppingPageCount">0</strong></div>
        </div>

        <div id="toppingQueue" class="task-list"></div>
      </section>

      <section class="app-view" id="view-handoff" data-view="handoff" hidden>
        <div class="page-heading">
          <h2>商品渡し</h2>
          <div class="count-chip"><span>待ち</span><strong id="handoffPageCount">0</strong></div>
        </div>

        <div id="handoffQueue" class="task-list"></div>
      </section>

      <section class="app-view" id="view-log" data-view="log" hidden>
        <div class="page-heading">
          <h2>Log</h2>
        </div>

        <div id="logList" class="log-list"></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <button class="bottom-nav-item active" data-view-target="order" aria-current="page" type="button">
      <span>注文受付</span>
    </button>

    <button class="bottom-nav-item" data-view-target="topping" type="button">
      <span>トッピング</span>
      <span class="nav-count" id="toppingNavCount" hidden>0</span>
    </button>

    <button class="bottom-nav-item" data-view-target="handoff" type="button">
      <span>商品渡し</span>
      <span class="nav-count" id="handoffNavCount" hidden>0</span>
    </button>

    <button class="bottom-nav-item" data-view-target="log" type="button">
      <span>Log</span>
    </button>
  </nav>

  <dialog id="inventoryDialog" class="dialog">
    <form method="dialog" class="dialog-card" id="inventoryForm">
      <div class="dialog-head">
        <h2>在庫数を編集</h2>
        <button class="icon-btn" value="cancel" aria-label="閉じる">×</button>
      </div>

      <div id="inventoryFormRows" class="inventory-form-rows"></div>

      <div class="dialog-actions">
        <button class="ghost-btn" value="cancel">キャンセル</button>
        <button class="primary-btn" value="default">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
